name: Deploy to GitHub Pages

# GitHub Pages for this repo serves the `gh-pages` branch, so publishing is
# simply mirroring the source branch onto it. Every push goes live in ~30s.
on:
  push:
    branches:
      - claude/dazzling-johnson-4kc1r0
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror this commit to gh-pages
        run: git push --force origin HEAD:gh-pages
